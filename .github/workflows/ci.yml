name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - name: Derive Nx base and head SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Build everything
        run: pnpm build

      - name: Lint (module boundaries), typecheck and test
        run: pnpm exec nx affected -t lint typecheck test

      - name: Verify published file lists match the snapshot
        run: pnpm pack:check

      - name: Smoke test a clean install of the packed CLI
        run: pnpm smoke:install

      - name: Smoke test the libraries as a consumer would install them
        run: pnpm smoke:libs
